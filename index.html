<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        // 1. นำ firebaseConfig ที่ได้จากเว็บ Firebase มาวางทับตรงนี้ทั้งหมด
        const firebaseConfig = {
            apiKey: "AIzaSyDmmi0VA4FoGPAKXIY4vVX9lRWk2O_-87s", 
            authDomain: "tinytails-db.firebaseapp.com", 
            databaseURL: "tinytails-db", 
            projectId: "tinytails-db.firebasestorage.app",
            storageBucket: "943214555111", 
            messagingSenderId: "1:943214555111:web:47b39cf1ed806cbdcd5742", 
            appId: "G-T8WB70WXZ7" 
        };

        // 2. เริ่มต้นเชื่อมต่อฐานข้อมูล
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultData = [
            { id: 1, category: 'tier1', name: 'Marshmellow Cubee', desc: 'ข้อมูลสัตว์เลี้ยงประเภท Cubee', petImg: 'https://via.placeholder.com/110/cbd5e1/ffffff?text=Marshmellow', itemImg: 'https://via.placeholder.com/110/cbd5e1/0f172a?text=Item', itemName: 'ผลผลิต', food: '600 ชิ้น', prod: '2 ชิ้น / รอบ', max: '120 ชิ้น', price: 'X', hrQty: 'X ชิ้น', hrCoin: 'X คอยน์', refill1: '10 รอบ', refill2: '5 รอบ' },
            { id: 2, category: 'sweet', name: 'Gummy Bear Cubee', desc: 'ผลผลิต: เยลลี่หมีเด้งดึ๋ง', petImg: 'https://via.placeholder.com/110/f59e0b/ffffff?text=Gummy', itemImg: 'https://via.placeholder.com/110/f59e0b/0f172a?text=Jelly', itemName: 'เยลลี่หมีเด้งดึ๋ง', food: '750', prod: 'X', max: '150', price: '20', hrQty: 'X', hrCoin: 'X', refill1: '12 รอบ', refill2: '6 รอบ' }
        ];

        let cubeeDb = [];

        // 3. ระบบดึงข้อมูลแบบ Realtime (แทนที่ localStorage)
        // ทุกครั้งที่มีการแก้ข้อมูล โค้ดส่วนนี้จะทำงานอัตโนมัติ ทำให้หน้าเว็บทุกคนอัปเดตพร้อมกัน
        db.ref('tinytails_db').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                cubeeDb = Object.values(data); // แปลงข้อมูลจากก้อน Object เป็น Array
            } else {
                cubeeDb = defaultData; // ถ้าฐานข้อมูลว่างเปล่า ให้ใช้ข้อมูลตัวอย่าง
            }
            renderUI();
        });

        // ==========================================
        // ฟังก์ชัน UI และการจัดการหน้าเว็บเหมือนเดิมทั้งหมด
        // ==========================================
        function renderUI() {
            ['tier1', 'tier2', 'sweet', 'huge'].forEach(cat => {
                const grid = document.getElementById(`grid-${cat}`);
                if(grid) grid.innerHTML = ''; 
            });

            cubeeDb.forEach(item => {
                let html = `
                    <div class="card">
                        <div>
                            <div class="img-box"><img src="${item.petImg}" alt="img"></div>
                            <h3 class="card-title">${item.name}</h3>
                            <p class="card-desc">${item.desc}</p>
                        </div>
                        <div class="btn-group">
                            <button class="btn-view" onclick="openViewModal(${item.id})">🔍 ข้อมูล</button>
                            <button class="btn-edit" onclick="openEditModal(${item.id})">✏️ แก้ไข</button>
                        </div>
                    </div>
                `;
                if(document.getElementById(`grid-${item.category}`)) {
                    document.getElementById(`grid-${item.category}`).insertAdjacentHTML('beforeend', html);
                }
            });
        }

        function showPage(pageId, clickedBtn) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');
            let sections = document.querySelectorAll('.page-section');
            if(pageId === 'all') {
                sections.forEach(sec => sec.classList.add('show'));
            } else {
                sections.forEach(sec => sec.classList.remove('show'));
                document.getElementById(pageId).classList.add('show');
            }
        }

        function openViewModal(id) {
            let data = cubeeDb.find(x => x.id === id);
            if(!data) return;
            document.getElementById('v-name').innerText = data.name;
            document.getElementById('v-petImg').src = data.petImg;
            document.getElementById('v-itemImg').src = data.itemImg;
            document.getElementById('v-itemName').innerText = data.itemName;
            document.getElementById('v-food').innerText = data.food;
            document.getElementById('v-prod').innerText = data.prod;
            document.getElementById('v-max').innerText = data.max;
            document.getElementById('v-price').innerText = data.price + (data.price.includes('บาท') ? '' : ' / ชิ้น');
            document.getElementById('v-hrQty').innerText = data.hrQty;
            document.getElementById('v-hrCoin').innerText = data.hrCoin;
            document.getElementById('v-refill1').innerText = data.refill1;
            document.getElementById('v-refill2').innerText = data.refill2;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function openEditModal(id, category = '') {
            if(id) {
                let data = cubeeDb.find(x => x.id === id);
                document.getElementById('e-id').value = data.id;
                document.getElementById('e-category').value = data.category;
                document.getElementById('e-name').value = data.name;
                document.getElementById('e-desc').value = data.desc;
                document.getElementById('e-petImg').value = data.petImg;
                document.getElementById('e-itemImg').value = data.itemImg;
                document.getElementById('e-itemName').value = data.itemName;
                document.getElementById('e-food').value = data.food;
                document.getElementById('e-prod').value = data.prod;
                document.getElementById('e-max').value = data.max;
                document.getElementById('e-price').value = data.price;
                document.getElementById('e-hrQty').value = data.hrQty;
                document.getElementById('e-hrCoin').value = data.hrCoin;
                document.getElementById('e-refill1').value = data.refill1;
                document.getElementById('e-refill2').value = data.refill2;
                
                showPreviewImage('preview-pet', data.petImg);
                showPreviewImage('preview-item', data.itemImg);
                document.getElementById('btn-delete').style.display = 'block';
            } else {
                document.getElementById('e-id').value = '';
                document.getElementById('e-category').value = category;
                ['e-name','e-desc','e-petImg','e-itemImg','e-itemName','e-food','e-prod','e-max','e-price','e-hrQty','e-hrCoin','e-refill1','e-refill2'].forEach(field => document.getElementById(field).value = '');
                
                showPreviewImage('preview-pet', '');
                showPreviewImage('preview-item', '');
                document.getElementById('btn-delete').style.display = 'none';
            }
            document.getElementById('editModal').style.display = 'flex';
        }

        function showPreviewImage(previewId, src) {
            let imgEl = document.getElementById(previewId);
            let pEl = imgEl.previousElementSibling.previousElementSibling;
            let spanEl = imgEl.previousElementSibling;
            
            if(src && (src.startsWith('data:image') || src.startsWith('http'))) {
                imgEl.src = src;
                imgEl.style.display = 'block';
                pEl.style.display = 'none';
                spanEl.style.display = 'none';
            } else {
                imgEl.src = '';
                imgEl.style.display = 'none';
                pEl.style.display = 'block';
                spanEl.style.display = 'block';
            }
        }

        function processImageFile(file, previewId, hiddenInputId) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_SIZE = 150; 
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64data = canvas.toDataURL('image/png'); 
                    document.getElementById(hiddenInputId).value = base64data;
                    showPreviewImage(previewId, base64data);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('zone-pet').addEventListener('click', () => document.getElementById('file-pet').click());
        document.getElementById('zone-item').addEventListener('click', () => document.getElementById('file-item').click());
        document.getElementById('file-pet').addEventListener('change', function(e) { processImageFile(e.target.files[0], 'preview-pet', 'e-petImg'); });
        document.getElementById('file-item').addEventListener('change', function(e) { processImageFile(e.target.files[0], 'preview-item', 'e-itemImg'); });

        function setupPaste(zoneId, previewId, hiddenId) {
            document.getElementById(zoneId).addEventListener('paste', function(e) {
                e.preventDefault();
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].kind === 'file' && items[i].type.startsWith('image/')) {
                        processImageFile(items[i].getAsFile(), previewId, hiddenId);
                        break;
                    }
                }
            });
        }
        setupPaste('zone-pet', 'preview-pet', 'e-petImg');
        setupPaste('zone-item', 'preview-item', 'e-itemImg');

        // 4. แก้ไขระบบ Save ให้วิ่งไปหา Firebase แทน
        function saveData() {
            let id = document.getElementById('e-id').value;
            let finalId = id ? parseInt(id) : Date.now(); // สร้างไอดีใหม่ถ้าไม่มี

            let newData = {
                id: finalId,
                category: document.getElementById('e-category').value,
                name: document.getElementById('e-name').value || 'ไม่มีชื่อ',
                desc: document.getElementById('e-desc').value || '-',
                petImg: document.getElementById('e-petImg').value || 'https://via.placeholder.com/100/cbd5e1/ffffff?text=Img',
                itemImg: document.getElementById('e-itemImg').value || 'https://via.placeholder.com/100/cbd5e1/0f172a?text=Item',
                itemName: document.getElementById('e-itemName').value || '-',
                food: document.getElementById('e-food').value || '-',
                prod: document.getElementById('e-prod').value || '-',
                max: document.getElementById('e-max').value || '-',
                price: document.getElementById('e-price').value || '-',
                hrQty: document.getElementById('e-hrQty').value || '-',
                hrCoin: document.getElementById('e-hrCoin').value || '-',
                refill1: document.getElementById('e-refill1').value || '-',
                refill2: document.getElementById('e-refill2').value || '-'
            };

            // โยนข้อมูลอัปเดตขึ้น Firebase
            db.ref('tinytails_db/' + finalId).set(newData).then(() => {
                closeModal('editModal');
                let toast = document.getElementById("toast");
                toast.className = "toast show";
                setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
            }).catch((error) => {
                alert("เกิดข้อผิดพลาดในการบันทึก: " + error);
            });
        }

        // 5. แก้ไขระบบ Delete ให้ลบใน Firebase
        function deleteData() {
            if(confirm('คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลนี้ทิ้งถาวร?')) {
                let id = parseInt(document.getElementById('e-id').value);
                
                db.ref('tinytails_db/' + id).remove().then(() => {
                    closeModal('editModal');
                }).catch((error) => {
                    alert("เกิดข้อผิดพลาดในการลบ: " + error);
                });
            }
        }

        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        window.onclick = function(event) {
            if (event.target == document.getElementById('infoModal')) closeModal('infoModal');
            if (event.target == document.getElementById('editModal')) closeModal('editModal');
        }
    </script>
