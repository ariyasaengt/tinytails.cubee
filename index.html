<!-- 🌟 ป๊อปอัพเข้าสู่ระบบสำหรับแอดมิน -->
<div id="authModal" class="modal">
    <div class="modal-content mc-auth-box">
        <button class="close-btn" onclick="closeModal('authModal')" style="background: #27272a; color: #a1a1aa;">&times;</button>
        
        <div class="mc-header">
            <div class="mc-title-group">
                <div class="mc-icon-badge">➜</div>
                <div>
                    <h3 class="mc-title">เข้าสู่ระบบแอดมิน</h3>
                    <p class="mc-subtitle">สำหรับผู้ดูแลเว็บไซต์เท่านั้น</p>
                </div>
            </div>
        </div>

        <div class="mc-form-group">
            <label>อีเมลแอดมิน</label>
            <input type="email" id="authEmail" class="mc-input" placeholder="admin@tinytails.com" autocomplete="off">
        </div>
        
        <div class="mc-form-group">
            <label>รหัสผ่าน</label>
            <div class="mc-input-wrapper">
                <input type="password" id="authPassword" class="mc-input" placeholder="••••••" autocomplete="off">
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()">👁️</button>
            </div>
        </div>

        <div class="mc-footer-actions">
            <button type="button" class="btn-cancel-mc" onclick="closeModal('authModal')">ยกเลิก</button>
            <!-- เรียกใช้ฟังก์ชันแอดมินโดยตรง -->
            <button type="button" class="btn-submit-mc" onclick="processAdminAuth()">➜ เข้าสู่ระบบ</button>
        </div>

        <div class="mc-hint-footer">
            ระบบจำกัดสิทธิ์เฉพาะแอดมินเท่านั้น
        </div>
    </div>
</div>
