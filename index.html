<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TINYTAILS CUBEE</title>
    
    <link rel="icon" href="https://img2.pic.in.th/icon88e0717927d5a748.png" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f5f7fb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --coin-color: #10b981; 
            --thb-color: #ef4444; 
            --special-color: #8b5cf6;
            --primary-blue: #3b82f6;
            --nav-bg: rgba(255, 255, 255, 0.8);
            --modal-bg: rgba(15, 23, 42, 0.6);
            --box-bg: #f8fafc;
        }

        body.dark-mode {
            --bg-light: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --nav-bg: rgba(30, 41, 59, 0.9);
            --box-bg: #0f172a;
        }

        /* ปรับ Font-weight ทั่วทั้งเว็บให้เบาลง (600 สำหรับหัวข้อ, 400 สำหรับเนื้อหา) */
        body { font-family: 'Kanit', sans-serif; font-weight: 400; background-color: var(--bg-light); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; transition: background-color 0.3s, color 0.3s; }
        
        h1, h2, h3, h4, .nav-btn, .card-title, .modal-title, .btn-save, .btn-add { font-weight: 600; }

        .navbar { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; padding: 20px; background: var(--nav-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .nav-btn { background-color: var(--box-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 50px; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        .theme-btn { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; padding: 5px 10px; }
        
        .auth-nav-btn { background: var(--coin-color); color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: 600; cursor: pointer; font-family: inherit; }

        .search-container { max-width: 600px; margin: 30px auto 10px auto; padding: 0 20px; }
        .search-box { width: 100%; padding: 14px 20px; border-radius: 30px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 1rem; outline: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 10px 20px 80px 20px; }
        .page-section { display: none; }
        .page-section.show { display: block; }

        .category-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-top: 30px; margin-bottom: 25px; }
        .category-title h2 { font-size: 1.5rem; }
        .price-tag { font-size: 0.95rem; background: var(--card-bg); padding: 6px 16px; border-radius: 30px; border: 1px solid var(--border-color); }
        
        .btn-add { display: none; background: var(--primary-blue); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border-color); padding: 24px; text-align: center; display: flex; flex-direction: column; }
        
        .img-box { background: var(--box-bg); border-radius: 16px; padding: 20px; margin-bottom: 15px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .img-box img { max-width: 100px; max-height: 100px; }
        .card-title { font-size: 1.2rem; margin: 10px 0 5px 0; }
        
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .btn-view, .btn-edit { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--box-bg); cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-bg); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border-radius: 20px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 25px; }
        
        .stat-rank-item { display: flex; align-items: center; gap: 15px; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .stat-rank-name { font-weight: 600; font-size: 1rem; }
        .stat-rank-val { font-weight: 600; font-size: 1rem; margin-left: auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn active" onclick="showPage('all', this)">หน้าแรก</button>
        <button class="nav-btn" onclick="showPage('tier1', this)">Tier 1</button>
        <button class="nav-btn" onclick="showPage('tier2', this)">Tier 2</button>
        <button class="nav-btn" onclick="showPage('sweet', this)">SWEET</button>
        <button class="nav-btn" onclick="showPage('huge', this)">HUGE</button>
        <button class="nav-btn" onclick="showPage('special', this)">SPECIAL</button>
        <button class="nav-btn" onclick="showPage('ranking', this)">🏆 จัดอันดับ</button>
        <button class="auth-nav-btn" id="authBtn" onclick="openAuthModal()">🔑 เข้าสู่ระบบ</button>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
    </nav>

    <div class="container">
        <!-- เนื้อหาอื่นๆ คงเดิมตามที่คุณตั้งไว้ -->
        <div id="tier1" class="page-section show">...</div>
        <!-- (เหลือโค้ดส่วนเดิมไว้เหมือนเดิมทุกประการ) -->
    </div>

    <!-- Script และส่วนประกอบอื่นๆ เหมือนเดิม -->
    <script>
        // โค้ด JavaScript เดิมของคุณทั้งหมด
    </script>
</body>
</html>
